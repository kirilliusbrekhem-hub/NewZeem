<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>newzeem. Админка</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root { --bg: #FFF3D6; --card: #fff; --ink: #141414; --muted: #5E594D; --soft: #EADFC4; --tint: #FFF9EA; --accent: #C8321B; --mark: #FFD84D; --ok: #2B8A3E; --sky: #CFE8FF;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #15130F; --card: #201C16; --ink: #F3ECDD; --muted: #B5AC99; --soft: #3A3428; --tint: #29241B; --accent: #FF6A4D; --mark: #9C7D14; --ok: #5BC274; --sky: #1E3A55; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--bg); border-bottom: 2px solid var(--ink); }
.top b { font: 900 22px/1 var(--sans); letter-spacing: -.04em; }
.top b i { color: var(--accent); font-style: normal; }
.top .tag { font: 800 12px/1 var(--sans); padding: 6px 9px; border-radius: 99px; background: var(--ink); color: var(--bg); }
.top .sp { flex: 1; }
nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 18px 0; max-width: 1100px; margin: 0 auto; }
nav button { font: 800 15px/1 var(--sans); padding: 11px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); }
nav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
nav button span { display: inline-block; min-width: 20px; margin-inline-start: 6px; padding: 2px 6px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; }
main { max-width: 1100px; margin: 0 auto; padding: 14px 18px 60px; }
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink); padding: 18px; margin-top: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-top: 18px; }
.tile { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); padding: 16px; }
.tile b { display: block; font: 900 36px/1 var(--sans); letter-spacing: -.03em; }
.tile span { font: 700 13px/1.3 var(--sans); color: var(--muted); }
.tile.hot { background: var(--mark); color: #141414; } .tile.hot span { color: #141414; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 800 14px/1 var(--sans); padding: 11px 14px; border-radius: 11px; border: 2px solid var(--ink); background: var(--card); box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: none; }
.btn.ok { background: var(--ok); color: #fff; } .btn.no { background: var(--accent); color: #fff; } .btn.dark { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .5; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.muted { color: var(--muted); font-size: 14px; }
h1 { font: 900 34px/1.05 var(--sans); letter-spacing: -.04em; margin: 14px 0 4px; }
h2 { font: 900 24px/1.2 var(--sans); letter-spacing: -.02em; margin: 0 0 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font: 700 13px/1.3 var(--sans); color: var(--muted); }
.pill { display: inline-block; font: 800 12px/1 var(--sans); padding: 5px 8px; border-radius: 99px; border: 2px solid var(--ink); background: var(--tint); color: var(--ink); }
.pill.warn { background: var(--accent); color: #fff; } .pill.good { background: var(--ok); color: #fff; } .pill.mid { background: var(--mark); color: #141414; }
.body { margin-top: 12px; padding: 14px; background: var(--tint); border: 2px dashed var(--ink); border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
.links { margin: 10px 0 0; padding-inline-start: 18px; font-size: 14px; overflow-wrap: anywhere; }
.ai { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--ink); background: var(--sky); font-size: 14px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.reasons button { font: 700 13px/1 var(--sans); padding: 7px 10px; border-radius: 99px; border: 2px solid var(--ink); background: var(--tint); }
input.in, textarea.in { width: 100%; padding: 11px 12px; border: 2px solid var(--ink); border-radius: 11px; background: var(--card); }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14.5px; }
th, td { text-align: start; padding: 9px 8px; border-bottom: 2px dashed var(--soft); vertical-align: top; }
th { font: 800 12.5px/1.2 var(--sans); color: var(--muted); }
.msg { padding: 10px 0; border-bottom: 2px dashed var(--soft); }
.msg.hid { opacity: .55; }
.login { max-width: 420px; margin: 12vh auto 0; }
.empty { padding: 24px 0; font-weight: 700; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 800; z-index: 9; }
.feeds td:nth-child(3) { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { table { font-size: 13px; } th:nth-child(4), td:nth-child(4) { display: none; } }
</style>
</head>
<body>
<header class="top"><img src="icon.svg" width="30" height="30" alt=""><b>newzeem<i>.</i></b><span class="tag">админка</span><span class="sp"></span><a class="btn" href="/" target="_blank" rel="noopener">Сайт ↗</a><button class="btn" id="out" type="button" hidden>Выйти</button></header>
<nav id="nav" hidden></nav>
<main id="main"></main>
<script src="admin.js"></script>
</body>
</html>
